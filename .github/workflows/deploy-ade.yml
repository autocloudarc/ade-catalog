name: Deploy to ADE Environments

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to (dev, tst, or all)"
        required: true
        default: "all"
        type: choice
        options:
          - dev
          - tst
          - all
      cleanupAfterDeploy:
        description: "Delete environments after successful deployment"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      deleteAllAfter30mins:
        description: "Delete environments after 30 minutes (workflow runtime limit)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  DEV_CENTER_NAME: ${{ secrets.ADE_DEV_CENTER_NAME }}
  PROJECT_NAME: ${{ secrets.ADE_PROJECT_NAME }}
  ENVIRONMENT_DEFINITION_NAME: tf-deployment
  CATALOG_NAME: ade-catalog
  DEV_ENVIRONMENT_TYPE: dev
  TST_ENVIRONMENT_TYPE: tst
  CLEANUP_AFTER_MINS: 30

permissions:
  id-token: write
  contents: read

jobs:
  generate-env-names:
    runs-on: ubuntu-latest
    name: Generate Environment Names
    outputs:
      dev-env-name: ${{ steps.gen-names.outputs.dev-env-name }}
      tst-env-name: ${{ steps.gen-names.outputs.tst-env-name }}
    steps:
      - name: Generate Numbered Environment Names
        id: gen-names
        run: |
          DEV_COUNTER=$(printf "%02d" $(($(date +%s) % 100 + 1)))
          TST_COUNTER=$(printf "%02d" $((($(date +%s) + 1) % 100 + 1)))
          echo "dev-env-name=dev-${DEV_COUNTER}" >> $GITHUB_OUTPUT
          echo "tst-env-name=tst-${TST_COUNTER}" >> $GITHUB_OUTPUT

  deploy-dev:
    runs-on: ubuntu-latest
    name: Deploy to Dev
    needs: generate-env-names
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy to Dev ADE
        run: |
          az devcenter dev environment create \
            --dev-center-name "${{ env.DEV_CENTER_NAME }}" \
            --project-name "${{ env.PROJECT_NAME }}" \
            --catalog-name "${{ env.CATALOG_NAME }}" \
            --environment-type "${{ env.DEV_ENVIRONMENT_TYPE }}" \
            --environment-name "${{ needs.generate-env-names.outputs.dev-env-name }}" \
            --environment-definition-name "${{ env.ENVIRONMENT_DEFINITION_NAME }}" \
            --parameters '{"rbac_storage_account_prefix":"devsta","web-nsg":"dev-web-nsg","app-nsg":"dev-app-nsg","dta-nsg":"dev-dta-nsg","logAnalyticsWorkspaceName":"dev-law-01"}'

      - name: Get Dev Environment Details
        if: success()
        run: |
          az devcenter dev environment show \
            --dev-center-name "${{ env.DEV_CENTER_NAME }}" \
            --project-name "${{ env.PROJECT_NAME }}" \
            --environment-name "${{ needs.generate-env-names.outputs.dev-env-name }}"

      - name: Dev Deployment Summary
        if: always()
        run: |
          echo "## Dev Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Dev" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  approval:
    runs-on: ubuntu-latest
    name: Request Approval for Tst
    needs: deploy-dev
    if: success()
    environment:
      name: tst
    steps:
      - name: Request Manual Approval
        run: |
          echo "Dev deployment completed successfully!"
          echo "Waiting for manual approval to proceed with Tst deployment..."
          echo "Review the Dev environment and approve to continue."

  deploy-tst:
    runs-on: ubuntu-latest
    name: Deploy to Tst
    needs: [approval, generate-env-names]
    environment:
      name: tst
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          enable-AzPSSession: false
          environment: azurecloud
          allow-no-subscriptions: true
          audience: api://AzureADTokenExchange
          auth-type: SERVICE_PRINCIPAL

      - name: Deploy to Tst ADE
        run: |
          az devcenter dev environment create \
            --dev-center-name "${{ env.DEV_CENTER_NAME }}" \
            --project-name "${{ env.PROJECT_NAME }}" \
            --catalog-name "${{ env.CATALOG_NAME }}" \
            --environment-type "${{ env.TST_ENVIRONMENT_TYPE }}" \
            --environment-name "${{ needs.generate-env-names.outputs.tst-env-name }}" \
            --environment-definition-name "${{ env.ENVIRONMENT_DEFINITION_NAME }}" \
            --parameters '{"rbac_storage_account_prefix":"tststa","web-nsg":"tst-web-nsg","app-nsg":"tst-app-nsg","dta-nsg":"tst-dta-nsg","logAnalyticsWorkspaceName":"tst-law-01"}'

      - name: Get Tst Environment Details
        if: success()
        run: |
          az devcenter dev environment show \
            --dev-center-name "${{ env.DEV_CENTER_NAME }}" \
            --project-name "${{ env.PROJECT_NAME }}" \
            --environment-name "${{ needs.generate-env-names.outputs.tst-env-name }}"

      - name: Tst Deployment Summary
        if: always()
        run: |
          echo "## Tst Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Tst" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup - Delete Environments
    needs: [deploy-dev, deploy-tst, generate-env-names]
    if: success() && (inputs.cleanupAfterDeploy == 'true' || inputs.deleteAllAfter30mins == 'true')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          enable-AzPSSession: false
          environment: azurecloud
          allow-no-subscriptions: true
          audience: api://AzureADTokenExchange
          auth-type: SERVICE_PRINCIPAL

      - name: Delete Dev Environment
        run: |
          echo "Deleting Dev environment..."
          az devcenter dev environment delete --dev-center-name "${{ env.DEV_CENTER_NAME }}" --project-name "${{ env.PROJECT_NAME }}" --environment-name "${{ needs.generate-env-names.outputs.dev-env-name }}" --yes || echo "Dev environment not found or already deleted"

      - name: Delete Tst Environment
        run: |
          echo "Deleting Tst environment..."
          az devcenter dev environment delete --dev-center-name "${{ env.DEV_CENTER_NAME }}" --project-name "${{ env.PROJECT_NAME }}" --environment-name "${{ needs.generate-env-names.outputs.tst-env-name }}" --yes || echo "Tst environment not found or already deleted"

      - name: Cleanup Summary
        if: always()
        run: |
          echo "## Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "Dev Environment: Deleted" >> $GITHUB_STEP_SUMMARY
          echo "Tst Environment: Deleted" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  scheduled-cleanup:
    runs-on: ubuntu-latest
    name: Scheduled Cleanup (30 mins)
    needs: [deploy-dev, deploy-tst, generate-env-names]
    if: success() && inputs.deleteAllAfter30mins == 'true'
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Wait for 30 minutes
        run: |
          echo "Waiting ${{ env.CLEANUP_AFTER_MINS }} minutes before cleanup..."
          sleep $((CLEANUP_AFTER_MINS * 60))
          echo "Cleanup timeout reached. Proceeding with environment deletion."

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          enable-AzPSSession: false
          environment: azurecloud
          allow-no-subscriptions: true
          audience: api://AzureADTokenExchange
          auth-type: SERVICE_PRINCIPAL

      - name: Delete Dev Environment (Scheduled)
        run: |
          echo "Deleting Dev environment after timeout..."
          az devcenter dev environment delete --dev-center-name "${{ env.DEV_CENTER_NAME }}" --project-name "${{ env.PROJECT_NAME }}" --environment-name "${{ needs.generate-env-names.outputs.dev-env-name }}" --yes || echo "Dev environment not found or already deleted"

      - name: Delete Tst Environment (Scheduled)
        run: |
          echo "Deleting Tst environment after timeout..."
          az devcenter dev environment delete --dev-center-name "${{ env.DEV_CENTER_NAME }}" --project-name "${{ env.PROJECT_NAME }}" --environment-name "${{ needs.generate-env-names.outputs.tst-env-name }}" --yes || echo "Tst environment not found or already deleted"

      - name: Scheduled Cleanup Summary
        if: always()
        run: |
          echo "## Scheduled Cleanup Summary (After 30 mins)" >> $GITHUB_STEP_SUMMARY
          echo "Dev Environment: Deleted" >> $GITHUB_STEP_SUMMARY
          echo "Tst Environment: Deleted" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
