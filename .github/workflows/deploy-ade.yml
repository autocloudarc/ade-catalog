name: Deploy to ADE Environments

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to (dev, tst, or all)"
        required: true
        default: "all"
        type: choice
        options:
          - dev
          - tst
          - all

env:
  DEV_CENTER_NAME: ${{ secrets.ADE_DEV_CENTER_NAME }}
  PROJECT_NAME: ${{ secrets.ADE_PROJECT_NAME }}
  ENVIRONMENT_DEFINITION_NAME: tf-deployment

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    name: Deploy to Dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Dev ADE
        run: |
          az devcenter dev environment create \
            --dev-center-name "${{ env.DEV_CENTER_NAME }}" \
            --project-name "${{ env.PROJECT_NAME }}" \
            --environment-name "dev" \
            --environment-definition-name "${{ env.ENVIRONMENT_DEFINITION_NAME }}" \
            --parameters \
              storageAccountPrefix="devsta" \
              web_nsg="dev-web-nsg" \
              app_nsg="dev-app-nsg" \
              dta_nsg="dev-dta-nsg" \
              logAnalyticsWorkspaceName="dev-law-01"

      - name: Get Dev Environment Details
        if: success()
        run: |
          az devcenter dev environment show \
            --dev-center-name "${{ env.DEV_CENTER_NAME }}" \
            --project-name "${{ env.PROJECT_NAME }}" \
            --environment-name "dev"

      - name: Dev Deployment Summary
        if: always()
        run: |
          echo "## Dev Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Dev" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  approval:
    runs-on: ubuntu-latest
    name: Request Approval for Tst
    needs: deploy-dev
    if: success()
    steps:
      - name: Request Manual Approval
        run: |
          echo "Dev deployment completed successfully!"
          echo "Waiting for manual approval to proceed with Tst deployment..."
          echo "Review the Dev environment and approve to continue."

  deploy-tst:
    runs-on: ubuntu-latest
    name: Deploy to Tst
    needs: approval
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
          environment: azurecloud
          allow-no-subscriptions: false
          audience: api://AzureADTokenExchange
          auth-type: SERVICE_PRINCIPAL

      - name: Deploy to Tst ADE
        run: |
          az devcenter dev environment create \
            --dev-center-name "${{ env.DEV_CENTER_NAME }}" \
            --project-name "${{ env.PROJECT_NAME }}" \
            --environment-name "tst" \
            --environment-definition-name "${{ env.ENVIRONMENT_DEFINITION_NAME }}" \
            --parameters \
              storageAccountPrefix="tststa" \
              web_nsg="tst-web-nsg" \
              app_nsg="tst-app-nsg" \
              dta_nsg="tst-dta-nsg" \
              logAnalyticsWorkspaceName="tst-law-01"

      - name: Get Tst Environment Details
        if: success()
        run: |
          az devcenter dev environment show \
            --dev-center-name "${{ env.DEV_CENTER_NAME }}" \
            --project-name "${{ env.PROJECT_NAME }}" \
            --environment-name "tst"

      - name: Tst Deployment Summary
        if: always()
        run: |
          echo "## Tst Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Tst" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
